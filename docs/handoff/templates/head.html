{{define "head"}}<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KeePass4Web</title>
<link rel="stylesheet" href="/static/tailwind.css">
<style>
:root{--bg-page:#f2f2f3;--bg-surface:#ffffff;--bg-surface-hover:#fafafa;--text-primary:#1d1f20;--text-secondary:#737373;--text-muted:#a3a3a3;--text-label:#525252;--border-default:#d4d4d4;--border-dashed:#a3a3a3;--divider:#e5e5e5}
#theme-root.dark{--bg-page:#17191b;--bg-surface:#202325;--bg-surface-hover:#2a2e31;--text-primary:#f3f4f5;--text-secondary:#a1a7ad;--text-muted:#7d848a;--text-label:#c4c9ce;--border-default:#34383b;--border-dashed:#4b5054;--divider:#2b2f32}
input,textarea,select{background-color:var(--bg-surface);color:var(--text-primary)}
::placeholder{color:var(--text-muted);opacity:1}
dialog{background-color:var(--bg-surface);color:var(--text-primary)}
</style>
<script src="/static/htmx.min.js" defer></script>
<script src="/static/app.js" defer></script>
</head>{{end}}

{{define "brand-mark"}}<span class="w-7 h-7 border border-[var(--text-primary)] flex items-center justify-center shrink-0">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="w-3.5 h-3.5 text-[#5980a6]"><rect x="4" y="11" width="16" height="9" rx="1"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
</span>{{end}}

{{define "corner-marks"}}<i class="absolute -top-2 -left-2 text-[10px] leading-none font-mono text-[#5980a6] select-none pointer-events-none">+</i>
<i class="absolute -top-2 -right-2 text-[10px] leading-none font-mono text-[#5980a6] select-none pointer-events-none">+</i>
<i class="absolute -bottom-2 -left-2 text-[10px] leading-none font-mono text-[#5980a6] select-none pointer-events-none">+</i>
<i class="absolute -bottom-2 -right-2 text-[10px] leading-none font-mono text-[#5980a6] select-none pointer-events-none">+</i>{{end}}

{{define "theme-toggle"}}<button type="button" data-action="toggle-theme" class="flex items-center justify-center w-8 h-8 border border-[var(--border-default)] text-[var(--text-secondary)] hover:text-[#5980a6] hover:border-[#5980a6] shrink-0" aria-label="Toggle dark mode">
  <svg class="w-4 h-4 dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
  <svg class="w-4 h-4 hidden dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"></path></svg>
</button>{{end}}
