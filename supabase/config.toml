project_id = "keepass4web-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
jwt_expiry = 3600
# v1 is provisioned for one account; new accounts are created administratively.
enable_signup = false

[storage]
enabled = true
file_size_limit = "50MiB"

[analytics]
enabled = false
